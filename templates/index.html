<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            margin-top: 40px;
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        input {
            margin: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Register Person</h2>
    <form action="/register" method="post" enctype="multipart/form-data">
        Name:<br>
        <input type="text" name="name" required><br><br>
        Upload Image:<br>
        <input type="file" name="image" required><br><br>
        <button type="submit">Register</button>
    </form>

    <hr><br>

    <h2>Recognize Person</h2>
    <form action="/recognize" method="post" enctype="multipart/form-data">
        Upload Image:<br>
        <input type="file" name="image" required><br><br>
        <button type="submit">Recognize</button>
    </form>

</div>

</body>
</html>
