<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition System - Register</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: radial-gradient(circle at 50% 120%, #4a00e0, #8e2de2, #0b0726, #000000);
            background-attachment: fixed;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            margin: 0 10px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .active-tab {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px;
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: left;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            font-weight: 700;
        }

        .form-label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }

        input {
            margin: 5px 0 20px;
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .message {
            color: #2e7d32;
            background-color: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #a5d6a7;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #ef9a9a;
            font-size: 14px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="nav">
    <a href="/" class="active-tab">Register</a>
    <a href="/recognize_page">Recognize</a>
    <a href="/database">View Database</a>
</div>

<div class="container">
    <h2>Register Person</h2>
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form action="/register" method="post" enctype="multipart/form-data">
        <label class="form-label">Name:</label>
        <input type="text" name="name" placeholder="Enter full name" required>
        
        <label class="form-label">Upload Image:</label>
        <input type="file" name="image" required>
        
        <button type="submit">Create Profile</button>
    </form>
</div>

</body>
</html>
